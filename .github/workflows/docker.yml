name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 纯文档 / 纯测试改动不重建镜像：它们不影响镜像内容，
    # 重建只会白白消耗 CI，并多一次污染 latest 的机会。
    # 注意：tag（v*）触发不受 paths-ignore 影响，发版照常构建。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 单元测试门禁：跑不过就根本轮不到构建，问题镜像推不上去。
  # 对齐 AutoBuddy 的做法（test job 先跑，build 声明 needs: test）。
  #
  # 这些测试刻意只依赖 node:test 与产物，外加一个 music-metadata；
  # 覆盖的是「错了会静默改坏数据或让界面少一块」的地方 ——
  # 队列下标、循环模式边界、LRC 解析、封面抽取缺 await、
  # 刮削封面的候选择优、FLAC 手写字节结构。
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # tags.test.mjs 引用 dist/ 下的产物并 import music-metadata，
      # 因此必须装依赖 + 先构建 server，不能直接跑测试。
      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build -w apps/server

      - name: Run unit tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tags 顺序与 enable 都很关键（每次都踩）：
          #   1) type=semver 必须在最前 —— outputs.version 取的是「tags 列表第一项」，
          #      否则 tag 构建产出的镜像版本号会变成分支名（曾错成 "main"）。
          #   2) type=ref,event=branch 必须加 enable={{is_default_branch}}：
          #      否则在 tag 事件下它也会生成 "main" 标签。
          #   3) latest 必须显式生成，Unraid 依赖它；而且**只能由 tag 构建生成**。
          #      若 latest 也挂在默认分支上，分支构建会与 tag 构建争抢同一个标签：
          #      两条路都写 latest，谁最后完成谁生效。分支构建的版本号是分支名
          #      （version=main），一旦它后完成就会把 latest 覆盖成 version=main 的
          #      镜像 —— 正是 v0.11.7 想根治却只堵住一半的那个问题。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      # 单架构先构建并落盘，既验证构建能走通，也用于启动冒烟测试。
      # 关键：这一步若卡住会明确失败，而不是让整条流水线长时间挂起。
      - name: Build (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tonecore:smoke
          build-args: |
            TONECORE_VERSION=${{ steps.meta.outputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 启动冒烟测试：原生模块能否加载、服务能否起来、健康检查是否通过。
      # 这样「镜像构建成功但容器跑不起来」不会再溜到线上。
      - name: Smoke test (boot + health)
        run: |
          set -e
          docker run -d --name tc-smoke -p 18090:8090 tonecore:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/api/health > /tmp/health.json 2>/dev/null; then
              echo "健康检查通过："; cat /tmp/health.json; echo
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::容器 60 秒内未通过健康检查，输出容器日志："
              docker logs tc-smoke
              exit 1
            fi
            sleep 2
          done
          # 曲库与配置接口也应正常响应（覆盖 sqlite 读写路径）
          curl -fsS http://127.0.0.1:18090/api/library/stats
          docker rm -f tc-smoke

      # 双架构正式构建并推送（amd64 命中上一步缓存，只补 arm64）
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 把版本号注入镜像，供 /api/health 与界面展示（与镜像标签同源）
          build-args: |
            TONECORE_VERSION=${{ steps.meta.outputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
