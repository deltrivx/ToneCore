<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    ToneCore 图标 · 圆角方底 · 音符 + 声波
    亮色版：天蓝渐变底 #2E9BE8 → #4FC3F7 / 音符纯白 / 声波亮琥珀 #FFC13B

    配色口径（亮色化）：
      旧版 #185FA5 是深靛蓝，在深色列表背景上发闷、辨识度低。
      新版改为高明度天蓝纵向渐变，主色亮度提升约 2 倍，
      在浅底与深底上都有足够对比。声波由 #EF9F27 提亮到 #FFC13B。

    构图口径：白色音符 + 琥珀声波的联合包围盒必须居中于画布。
  -->

  <defs>
    <!-- 纵向天蓝渐变：上浅下深，避免纯平色显得呆板 -->
    <linearGradient id="tcBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4FC3F7"/>
      <stop offset="55%"  stop-color="#2E9BE8"/>
      <stop offset="100%" stop-color="#1E7FD0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#tcBase)"/>

  <!-- 声波：居中对齐音符的垂直重心（中心 512），并贴近音符两侧 -->
  <path d="M 288 442 A 152 152 0 0 0 288 582"
        fill="none" stroke="#FFC13B" stroke-width="56" stroke-linecap="round"/>
  <path d="M 736 442 A 152 152 0 0 1 736 582"
        fill="none" stroke="#FFC13B" stroke-width="56" stroke-linecap="round"/>

  <!-- 音符 -->
  <g transform="translate(512 512) scale(1.06) translate(-512 -512) translate(-37 0)">
    <ellipse cx="470" cy="640" rx="110" ry="82"
             fill="#FFFFFF" transform="rotate(-20 470 640)"/>
    <rect x="540" y="320" width="82" height="340" fill="#FFFFFF"/>
    <path d="M 622 320
             C 712 334 752 400 736 478
             C 724 428 686 392 622 374 Z"
          fill="#FFFFFF"/>
  </g>
</svg>
